name: Cosmic Kernel CI Workflow

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      KERNEL_NAME: "Cosmic Core X"
      DEVICE: "violet"
      BRANCH_NAME: "lineage-23.2"
      LOG: "build.log"
      USER_TAG: "@IamZeus14"
      GOFILE_RETRY_MAX: 6

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: CosmicCoreX/cosmic_kernel_violet
          ref: ${{ env.BRANCH_NAME }}
          submodules: recursive

      - name: Initialize Telegram Progress Monitor
        run: |
          set -euo pipefail

          tg_send_init() {
            local text="$1"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                    --arg chat_id "$CHAT_ID" \
                    --arg text "$text" \
                    '{
                      chat_id: $chat_id,
                      text: $text,
                      parse_mode: "HTML",
                      disable_web_page_preview: true,
                      reply_markup: {
                        inline_keyboard: [[{text: "🔄 Refresh Info", callback_data: "refresh"}]]
                      }
                    }')" | jq -r '.result.message_id // empty'
          }

          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          BUILD_START=$(date +%s)

          INIT_HTML="<b>⚙️ ${KERNEL_NAME} (Android 16) Started</b>

          <b>📱 Device:</b> <code>${DEVICE}</code>
          <b>⌛ Started At:</b> <code>${NOW}</code>

          🚀 <i>Initializing runner workspace and build dependencies...</i>"

          PROGRESS_MSG_ID=$(tg_send_init "$INIT_HTML")

          echo "PROGRESS_MSG_ID=$PROGRESS_MSG_ID" >> "$GITHUB_ENV"
          echo "BUILD_START=$BUILD_START" >> "$GITHUB_ENV"

      - name: Free Disk Space & Set Up Swap
        run: |
          set -euo pipefail

          echo "Cleaning up runner disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

          echo "Configuring swap space..."
          if sudo modprobe zram num_devices=1 2>/dev/null && [ -d /sys/block/zram0 ]; then
            echo zstd | sudo tee /sys/block/zram0/comp_algorithm > /dev/null || true
            echo 16G | sudo tee /sys/block/zram0/disksize
            sudo mkswap /dev/zram0
            sudo swapon -p 32767 /dev/zram0
            echo "zRAM 16GB configured successfully."
          else
            echo "zRAM unavailable on Azure kernel. Resetting existing swap & creating 10GB swapfile..."
            sudo swapoff -a 2>/dev/null || true
            sudo rm -f /swapfile
            sudo fallocate -l 10G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo "10GB Swapfile enabled successfully."
          fi

      - name: Install System Dependencies & Clang
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev make gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi unzip lz4 zstd git-lfs curl jq

          mkdir -p toolchains/clang
          curl -s https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz | tar -xz -C toolchains/clang

      - name: Compile Kernel & Monitor Build Progress
        id: build-kernel
        run: |
          set -euo pipefail

          format_time() {
            local SECS=$1
            local h=$(( SECS / 3600 ))
            local m=$(( (SECS % 3600) / 60 ))
            local s=$(( SECS % 60 ))
            if [ "$h" -gt 0 ]; then
              echo "${h}h ${m}m ${s}s"
            else
              echo "${m}m ${s}s"
            fi
          }

          get_system_stats() {
            local mem_info=$(free -m | awk '/Mem:/ {print $2" "$3}')
            local mem_total=$(echo "$mem_info" | awk '{print $1}')
            local mem_used=$(echo "$mem_info" | awk '{print $2}')

            local swap_info=$(free -m | awk '/Swap:/ {print $2" "$3}')
            local swap_total=$(echo "$swap_info" | awk '{print $1}')
            local swap_used=$(echo "$swap_info" | awk '{print $2}')

            local load=$(cut -d' ' -f1 /proc/loadavg)

            local cpu_idle1 cpu_total1 cpu_idle2 cpu_total2
            read -r _ u1 n1 s1 i1 w1 irq1 sirq1 st1 _ < /proc/stat
            cpu_idle1=$((i1 + w1))
            cpu_total1=$((u1 + n1 + s1 + i1 + w1 + irq1 + sirq1 + st1))
            sleep 0.5
            read -r _ u2 n2 s2 i2 w2 irq2 sirq2 st2 _ < /proc/stat
            cpu_idle2=$((i2 + w2))
            cpu_total2=$((u2 + n2 + s2 + i2 + w2 + irq2 + sirq2 + st2))
            local diff_idle=$((cpu_idle2 - cpu_idle1))
            local diff_total=$((cpu_total2 - cpu_total1))
            local cpu_pct=0
            if [ "$diff_total" -gt 0 ]; then
              cpu_pct=$(( 100 * (diff_total - diff_idle) / diff_total ))
            fi

            echo "${cpu_pct}|${mem_used}|${mem_total}|${swap_used}|${swap_total}|${load}"
          }

          get_last_log_line() {
            if [ -f "$LOG" ] && [ -s "$LOG" ]; then
              tail -n 30 "$LOG" | grep -v '^\s*$' | tail -n 1 | cut -c1-100
            else
              echo "Starting build process..."
            fi
          }

          update_tg_status() {
            local msg_id="$1"
            local text="$2"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                    --arg chat_id "$CHAT_ID" \
                    --arg message_id "$msg_id" \
                    --arg text "$text" \
                    '{
                      chat_id: $chat_id,
                      message_id: $message_id,
                      text: $text,
                      parse_mode: "HTML",
                      disable_web_page_preview: true,
                      reply_markup: {
                        inline_keyboard: [[{text: "🔄 Refresh Info", callback_data: "refresh"}]]
                      }
                    }')" > /dev/null
          }

          listen_refresh() {
            set +e
            local offset=0
            while true; do
              UPDATES=$(curl -s --max-time 10 "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${offset}&timeout=5")
              if [ -n "$UPDATES" ]; then
                OK=$(echo "$UPDATES" | jq -r '.ok // false')
                if [ "$OK" = "true" ]; then
                  COUNT=$(echo "$UPDATES" | jq -r '.result | length // 0')
                  for ((i=0; i<COUNT; i++)); do
                    UPDATE=$(echo "$UPDATES" | jq -c ".result[$i]")
                    UPDATE_ID=$(echo "$UPDATE" | jq -r '.update_id')
                    offset=$((UPDATE_ID + 1))
                    CALLBACK_DATA=$(echo "$UPDATE" | jq -r '.callback_query.data // empty')
                    CALLBACK_ID=$(echo "$UPDATE" | jq -r '.callback_query.id // empty')

                    if [ "$CALLBACK_DATA" = "refresh" ]; then
                      curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/answerCallbackQuery" \
                        -d "callback_query_id=${CALLBACK_ID}" \
                        -d "text=Fetching fresh system stats..." > /dev/null

                      IFS='|' read -r CPU MEM_U MEM_T SWAP_U SWAP_T LOAD <<< "$(get_system_stats)"
                      CONSOLE=$(get_last_log_line)
                      ELAPSED=$(($(date +%s) - BUILD_START))
                      TIME_STR=$(format_time "$ELAPSED")
                      NOW_TIME=$(date -u +"%H:%M:%S UTC")

                      MSG_HTML="<b>⚙️ Building Kernel: ${KERNEL_NAME}</b>

                      <b>📱 Device:</b> <code>${DEVICE}</code>
                      <b>🔥 Status:</b> <code>Compiling...</code>

                      <b>📊 Server Real-Time Metrics:</b>
                      • <b>CPU Usage:</b> <code>${CPU}%</code>
                      • <b>RAM Usage:</b> <code>${MEM_U} MB / ${MEM_T} MB</code>
                      • <b>Swap Usage:</b> <code>${SWAP_U} MB / ${SWAP_T} MB</code>
                      • <b>Load Avg:</b> <code>${LOAD}</code>

                      <b>⏱️ Elapsed Time:</b> <code>${TIME_STR}</code>
                      <b>📟 Console Output:</b>
                      <code>${CONSOLE}</code>

                      <i>🔄 Refreshed At: ${NOW_TIME}</i>"

                      update_tg_status "$PROGRESS_MSG_ID" "$MSG_HTML"
                    fi
                  done
                fi
              fi
              sleep 1
            done
          }

          listen_refresh &
          LISTENER_PID=$!

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchains/clang/bin:$PATH"
          export KBUILD_BUILD_USER=iamZeus14
          export KBUILD_BUILD_HOST=crave

          touch "$LOG"
          mkdir -p out

          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
               arch/arm64/configs/vendor/sdmsteppe-perf_defconfig \
               arch/arm64/configs/vendor/violet.config 2>&1 | tee -a "$LOG"

          make O=out ARCH=arm64 olddefconfig 2>&1 | tee -a "$LOG"

          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               LLVM=1 \
               LLVM_IAS=1 \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee -a "$LOG"

          kill "$LISTENER_PID" 2>/dev/null || true

      - name: Package AnyKernel3 Zip & Upload Artifact
        if: always()
        run: |
          format_time() {
            local SECS=$1
            local h=$(( SECS / 3600 ))
            local m=$(( (SECS % 3600) / 60 ))
            local s=$(( SECS % 60 ))
            if [ "$h" -gt 0 ]; then
              echo "${h}h ${m}m ${s}s"
            else
              echo "${m}m ${s}s"
            fi
          }

          tg_post_msg() {
            local text="$1"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat_id "$CHAT_ID" --arg text "$text" \
                    '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')" > /dev/null
          }

          tg_edit_msg() {
            local msg_id="$1"
            local text="$2"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat_id "$CHAT_ID" --arg message_id "$msg_id" --arg text "$text" \
                    '{chat_id: $chat_id, message_id: $message_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')" > /dev/null
          }

          tg_send_file() {
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="$CHAT_ID" -F document=@"$1" -F caption="$2" > /dev/null
          }

          gofile_upload() {
            local FILE="$1"
            local FILENAME=$(basename "$FILE")
            [ ! -f "$FILE" ] && echo "⚠️ Skipped: $FILENAME" >&2 && return 1

            for SERVER in $(printf "%s\n" "${GOFILE_SERVERS[@]}" | shuf); do
              local ATTEMPT=0
              while [ "$ATTEMPT" -lt "$GOFILE_RETRY_MAX" ]; do
                ATTEMPT=$(( ATTEMPT + 1 ))
                RESPONSE=$(curl -4 --http1.1 -sf -F "file=@${FILE}" "https://${SERVER}.gofile.io/contents/uploadFile")
                LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
                if [ -n "$LINK" ]; then
                  echo "$LINK"
                  return 0
                fi
                sleep 2
              done
            done
            return 1
          }

          BUILD_END=$(date +%s)
          TIME=$(( BUILD_END - ${BUILD_START:-BUILD_END} ))
          TIME_FMT=$(format_time "$TIME")

          IMAGE_PATH="out/arch/arm64/boot/Image.gz-dtb"
          ZIP_NAME="CosmicKernel-${DEVICE}-A16-$(date +%Y%m%d-%H%M).zip"

          if [ "${{ steps.build-kernel.outcome }}" == "success" ] && [ -f "$IMAGE_PATH" ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
            cp "$IMAGE_PATH" AnyKernel3/
            cd AnyKernel3
            zip -r9 "../${ZIP_NAME}" * -x .git README.md
            cd ..

            mapfile -t GOFILE_SERVERS < <(curl -s "https://gofile.io/api/v2/getServers" | jq -r '.data.servers[].name // empty')

            if [ -n "${PROGRESS_MSG_ID:-}" ]; then
              SUCCESS_EDIT="<b>⚙️ Building Kernel: ${KERNEL_NAME}</b>

              <b>📱 Device:</b> <code>${DEVICE}</code>
              <b>🔥 Status:</b> ✅ <code>Success</code>
              <b>🕛 Duration:</b> <code>${TIME_FMT}</code>
              📦 <i>Uploading flashable zip artifact...</i>"
              tg_edit_msg "$PROGRESS_MSG_ID" "$SUCCESS_EDIT"
            fi

            LINK=$(gofile_upload "${ZIP_NAME}" || echo "")

            if [ -n "$LINK" ]; then
              FINAL_MSG="🎉 <b>${KERNEL_NAME} | ${DEVICE} (Android 16) — Build Complete</b>
              ━━━━━━━━━━━━━━━━━━

              📦 <b><a href=\"${LINK}\">${ZIP_NAME}</a></b>

              👤 <b>Maintainer:</b> <code>${USER_TAG}</code>
              🕛 <b>Total Build Time:</b> <code>${TIME_FMT}</code>"
            else
              FINAL_MSG="⚠️ Kernel compiled successfully, but GoFile upload failed."
            fi

            tg_post_msg "$FINAL_MSG"

          else
            if [ -n "${PROGRESS_MSG_ID:-}" ]; then
              FAIL_EDIT="<b>⚙️ Building Kernel: ${KERNEL_NAME}</b>

              <b>📱 Device:</b> <code>${DEVICE}</code>
              <b>🔥 Status:</b> ❌ <code>Failed</code>
              <b>🕛 Duration:</b> <code>${TIME_FMT}</code>"
              tg_edit_msg "$PROGRESS_MSG_ID" "$FAIL_EDIT"
            fi

            if [ -f "$LOG" ]; then
              tail -n 120 "$LOG" > error_tail.log
              tg_send_file "error_tail.log" "📜 Kernel Compilation Failure Log — ${DEVICE}"
              rm -f error_tail.log
            fi
          fi
