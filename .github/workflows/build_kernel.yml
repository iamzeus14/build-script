name: Cosmic Kernel CI Workflow

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      KERNEL_NAME: "Cosmic Core X"
      DEVICE: "violet"
      BRANCH_NAME: "lineage-23.2"
      LOG: "build.log"
      USER_TAG: "@IamZeus14"
      GOFILE_RETRY_MAX: 6

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: CosmicCoreX/cosmic_kernel_violet
          ref: ${{ env.BRANCH_NAME }}
          submodules: recursive

      - name: Free Disk Space & Set Up zRAM
        run: |
          set -euo pipefail

          # Free runner disk space
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          
          # Initialize zRAM
          sudo modprobe zram num_devices=1 || true
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm > /dev/null || true
          echo 16G | sudo tee /sys/block/zram0/disksize
          sudo mkswap /dev/zram0
          sudo swapon -p 32767 /dev/zram0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev make gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi unzip lz4 zstd git-lfs curl jq

      - name: Download AOSP Clang
        run: |
          mkdir -p toolchains/clang
          curl -s https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz | tar -xz -C toolchains/clang

      - name: Compile Kernel & Monitor Build Progress
        run: |
          set -euo pipefail

          tg_post_msg() {
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" -d parse_mode="Markdown" \
              -d disable_web_page_preview="true" -d text="$1" > /dev/null
          }

          tg_send_with_button() {
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" -d parse_mode="Markdown" \
              -d disable_web_page_preview="true" -d text="$1" \
              -d reply_markup='{"inline_keyboard": [[{"text": "🔄 Refresh Info", "callback_data": "refresh"}]]}' | jq -r '.result.message_id // empty'
          }

          tg_edit_with_button() {
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
              -d chat_id="$CHAT_ID" -d message_id="$1" -d parse_mode="Markdown" \
              -d disable_web_page_preview="true" -d text="$2" \
              -d reply_markup='{"inline_keyboard": [[{"text": "🔄 Refresh Info", "callback_data": "refresh"}]]}' > /dev/null
          }

          format_time() {
            local SECS=$1
            local h=$(( SECS / 3600 ))
            local m=$(( (SECS % 3600) / 60 ))
            local s=$(( SECS % 60 ))
            if [ "$h" -gt 0 ]; then
              echo "${h} hr ${m} min${s} sec"
            else
              echo "${m} min${s} sec"
            fi
          }

          get_stats() {
            read -r _ u1 n1 s1 i1 w1 irq1 sirq1 st1 _ < /proc/stat
            sleep 1
            read -r _ u2 n2 s2 i2 w2 irq2 sirq2 st2 _ < /proc/stat
            idle1=$((i1 + w1)); idle2=$((i2 + w2))
            total1=$((u1 + n1 + s1 + i1 + w1 + irq1 + sirq1 + st1))
            total2=$((u2 + n2 + s2 + i2 + w2 + irq2 + sirq2 + st2))
            diff_idle=$((idle2 - idle1)); diff_total=$((total2 - total1))
            local CPU=0
            [ "$diff_total" -gt 0 ] && CPU=$(( 100 * (diff_total - diff_idle) / diff_total ))
            MEM_USED=$(free -m | awk '/Mem:/ {print $3}')
            MEM_TOTAL=$(free -m | awk '/Mem:/ {print $2}')
            SWAP_USED=$(free -m | awk '/Swap:/ {print $3}')
            SWAP_TOTAL=$(free -m | awk '/Swap:/ {print $2}')
            LOAD=$(cut -d' ' -f1 /proc/loadavg)
            echo "${CPU}\vert{}${MEM_USED}|${MEM_TOTAL}\vert{}${LOAD}|${SWAP_USED}\vert{}${SWAP_TOTAL}"
          }

          listen_refresh() {
            local OFFSET=0
            while true; do
              UPDATES=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${OFFSET}")
              COUNT=$(echo "$UPDATES" | jq -r '.result | length // 0')
              if [ "$COUNT" -gt 0 ]; then
                for ((i=0; i<COUNT; i++)); do
                  UPDATE=$(echo "$UPDATES" \vert{} jq -c ".result[$i]")
                  UPDATE_ID=$(echo "$UPDATE" | jq -r '.update_id')
                  OFFSET=$((UPDATE_ID + 1))
                  CALLBACK=$(echo "$UPDATE" | jq -r '.callback_query.data // empty')
                  CALLBACK_ID=$(echo "$UPDATE" | jq -r '.callback_query.id // empty')

                  if [ "$CALLBACK" = "refresh" ]; then
                    curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/answerCallbackQuery" \
                      -d callback_query_id="$CALLBACK_ID" -d text="Updating status..." > /dev/null

                    STATS=$(get_stats)
                    CPU=$(echo "$STATS" | cut -d'|' -f1)
                    MEM_USED=$(echo "$STATS" | cut -d'|' -f2)
                    MEM_TOTAL=$(echo "$STATS" | cut -d'|' -f3)
                    LOAD=$(echo "$STATS" | cut -d'|' -f4)
                    SWAP_USED=$(echo "$STATS" | cut -d'|' -f5)
                    SWAP_TOTAL=$(echo "$STATS" | cut -d'|' -f6)

                    ELAPSED=$(($(date +%s) - BUILD_START ))
                    CONSOLE=$(grep -v '^\s*$' "$LOG" 2>/dev/null | tail -n1 | cut -c1-100 | sed 's/[^a-zA-Z0-9 _-]/./g')
                    NOW_LOCAL=$(date +"%H:%M:%S")

                    MSG_TEXT=$(printf "⚙️️ *Building Kernel (Android 16): %s*\n\n📱 Device: \`%s\`\n\n*Server Stats*\n💻 CPU: \`%s%%\`\n💾 RAM: \`%sMB / %sMB\`\n🚀 zRAM: \`%sMB / %sMB\`\n⚡ Load: \`%s\`\n\n🕛 Elapsed: %s\n🔥 Status: Compiling...\n📟 Console: \`%s\`\n\n🔄 Last Refreshed: \`%s\`" \
                      "$KERNEL_NAME" "$DEVICE" "$CPU" "$MEM_USED" "$MEM_TOTAL" "$SWAP_USED" "$SWAP_TOTAL" "$LOAD" "$(format_time "$ELAPSED")" "$CONSOLE" "$NOW_LOCAL")

                    tg_edit_with_button "$PROGRESS_MSG_ID" "$MSG_TEXT"
                  fi
                done
              fi
              sleep 3
            done
          }

          BUILD_START=$(date +%s)
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          tg_post_msg "🛠️ *${KERNEL_NAME}* (Android 16 Target) Triggered

📱 *Device*: \`${DEVICE}\`
⌛ *Time*: \`${NOW}\`"

          PROGRESS_MSG_ID=$(tg_send_with_button "🚀 Initializing Kernel Compilation...
Tap 🔄 Refresh Info to update stats!")

          echo "PROGRESS_MSG_ID=$PROGRESS_MSG_ID" >> $GITHUB_ENV
          echo "BUILD_START=$BUILD_START" >> $GITHUB_ENV

          listen_refresh &
          LISTENER_PID=$!
          echo "LISTENER_PID=$LISTENER_PID" >> $GITHUB_ENV

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchains/clang/bin:$PATH"
          export KBUILD_BUILD_USER=iamZeus14
          export KBUILD_BUILD_HOST=crave

          touch "$LOG"
          mkdir -p out

          # Merge base defconfig and violet fragment
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
               arch/arm64/configs/vendor/sdmsteppe-perf_defconfig \
               arch/arm64/configs/vendor/violet.config 2>&1 | tee -a "$LOG"

          # Resolve missing/updated dependency keys
          make O=out ARCH=arm64 olddefconfig 2>&1 | tee -a "$LOG"

          # Compile Kernel
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               LLVM=1 \
               LLVM_IAS=1 \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee -a "$LOG"

      - name: Package AnyKernel3 Zip & Upload Artifact
        if: always()
        run: |
          if [ -n "$LISTENER_PID" ]; then
            kill "$LISTENER_PID" 2>/dev/null || true
            wait "$LISTENER_PID" 2>/dev/null || true
          fi

          tg_post_msg() {
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" -d parse_mode="Markdown" \
              -d disable_web_page_preview="true" -d text="$1" > /dev/null
          }

          tg_edit_msg() {
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
              -d chat_id="$CHAT_ID" -d message_id="$1" -d parse_mode="Markdown" \
              -d disable_web_page_preview="true" -d text="$2" > /dev/null
          }

          tg_send_file() {
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="$CHAT_ID" -F document=@"$1" -F caption="$2" > /dev/null
          }

          format_time() {
            local SECS=$1
            local h=$(( SECS / 3600 ))
            local m=$(( (SECS % 3600) / 60 ))
            local s=$(( SECS % 60 ))
            if [ "$h" -gt 0 ]; then
              echo "${h} hr ${m} min${s} sec"
            else
              echo "${m} min${s} sec"
            fi
          }

          gofile_upload() {
            local FILE="$1"
            local FILENAME=$(basename "$FILE")
            [ ! -f "$FILE" ] && echo "⚠️ Skipped: $FILENAME" >&2 && return 1

            for SERVER in $(printf "\%s\n" "${GOFILE_SERVERS[@]}" | shuf); do
              local ATTEMPT=0
              while [ "$ATTEMPT" -lt "$GOFILE_RETRY_MAX" ]; do
                ATTEMPT=$(( ATTEMPT + 1 ))
                RESPONSE=$(curl -4 --http1.1 -sf -F "file=@${FILE}" "https://${SERVER}.gofile.io/contents/uploadFile")
                LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
                if [ -n "$LINK" ]; then
                  echo "$LINK"
                  return 0
                fi
                sleep 2
              done
            done
            return 1
          }

          BUILD_END=$(date +%s)
          TIME=$(( BUILD_END - BUILD_START ))
          TIME_FMT=$(format_time "$TIME")

          IMAGE_PATH="out/arch/arm64/boot/Image.gz-dtb"
          ZIP_NAME="CosmicKernel-${DEVICE}-A16-$(date +%Y%m%d-%H%M).zip"

          if [ "${{ steps.build-kernel.outcome }}" == "success" ] && [ -f "$IMAGE_PATH" ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
            cp "$IMAGE_PATH" AnyKernel3/
            cd AnyKernel3
            zip -r9 "../${ZIP_NAME}" * -x .git README.md
            cd ..

            mapfile -t GOFILE_SERVERS < <(curl -s "https://gofile.io/api/v2/getServers" | jq -r '.data.servers[].name // empty')

            if [ -n "$PROGRESS_MSG_ID" ]; then
              tg_edit_msg "$PROGRESS_MSG_ID" "⚙️ *Building Kernel: ${KERNEL_NAME}*

📱 Device: \`${DEVICE}\`
🔥 Status: ✅ Success
🕛 Time: ${TIME_FMT}
📦 Uploading flashable zip..."
            fi

            LINK=$(gofile_upload "${ZIP_NAME}")

            if [ -n "$LINK" ]; then
              FINAL_MSG="🎉 *${KERNEL_NAME} \vert{}${DEVICE} (Android 16) — Build Complete*
━━━━━━━━━━━━━━━━━━

📦 [${ZIP_NAME}](${LINK})

👤 By: \`${USER_TAG}\`
🕛 Build Time: ${TIME_FMT}"
            else
              FINAL_MSG="⚠ Kernel compiled successfully, but GoFile upload failed."
            fi

            tg_post_msg "$FINAL_MSG"

          else
            if [ -n "$PROGRESS_MSG_ID" ]; then
              tg_edit_msg "$PROGRESS_MSG_ID" "⚙️ *Building Kernel: ${KERNEL_NAME}*

📱 Device: \`${DEVICE}\`
🔥 Status: ❌ Failed
🕛 Time: ${TIME_FMT}"
            fi

            if [ -f "$LOG" ]; then
              tail -n 120 "$LOG" > error_tail.log
              tg_send_file "error_tail.log" "📜 Kernel Compilation Failure Log — ${DEVICE}"
              rm -f error_tail.log
            fi
          fi
